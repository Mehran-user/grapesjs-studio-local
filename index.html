<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GrapeSite</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #121215;
        color: #d4d4d8;
        font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .landing { text-align: center; padding: 32px; }
      .landing h1 { font-size: 28px; font-weight: 700; color: #f4f4f5; margin-bottom: 12px; }
      .landing p { font-size: 15px; color: #6f7078; margin-bottom: 28px; }
      .landing a {
        display: inline-block;
        padding: 11px 26px;
        border-radius: 10px;
        background: #7d4bff;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .landing a:hover { background: #8f62ff; }
    </style>
  </head>
  <body>
    <div class="landing">
      <h1>GrapeSite</h1>
      <p>Home page under construction.</p>
      <a href="app/">Go to app</a>
    </div>
  </body>
</html>

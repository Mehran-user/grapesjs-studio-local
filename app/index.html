        function showToast(msg, type) {
          const wrap = el('toasts');
          const t = document.createElement('div');
          t.className = 'gs-toast' + (type ? ' gs-toast--' + type : '');
          t.innerHTML = '<span>' + esc(msg) + '</span>';
          wrap.appendChild(t);
          requestAnimationFrame(() => t.classList.add('show'));
          setTimeout(() => {
            t.classList.remove('show');
            setTimeout(() => t.remove(), 300);
          }, 2600);
        }

            el('progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
          } else {
            el('progress').classList.add('gs-progress--busy');
            el('progressBar').style.width = '';
          }
        }
        function setProgress(pct) {
          if (el('progress').hidden) return;
          el('progress').classList.remove('gs-progress--busy');
          el('progressBar').style.width = Math.max(0, Math.min(100, pct)) + '%';
        }
        function hideProgress() {
          el('progress').classList.remove('gs-progress--busy');
          el('progressBar').style.width = '0%';
          setTimeout(() => {
            if (el('progress').hidden) return;
            el('progress').hidden = true;
            el('progressBar').style.width = '';
          }, 300);
        }
        window.showProgress = showProgress;
        window.setProgress = setProgress;
        window.hideProgress = hideProgress;

        const modal = el('modal');
        function openModal(opts) {
          el('modalTitle').textContent = opts.title || '';
          el('modalBody').innerHTML = opts.bodyHTML || '';
          const foot = el('modalFoot');
          foot.innerHTML = '';
          (opts.actions || []).forEach((a) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'gs-btn' + (a.variant ? ' gs-btn--' + a.variant : '');
            btn.textContent = a.label;
            btn.onclick = a.onClick || (() => {});
            foot.appendChild(btn);
          });
          modal.hidden = false;
          requestAnimationFrame(() => modal.classList.add('open'));
        }
        function closeModal() {
          modal.classList.remove('open');
          setTimeout(() => (modal.hidden = true), 150);
        }
        modal.addEventListener('click', (e) => {
          if (e.target.closest('[data-close]')) closeModal();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (!modal.hidden) closeModal();

        /* ------------------------------------------------------------------ */
        /*  Properties panel: link traits + custom attributes (key=value)      */
        /* ------------------------------------------------------------------ */
        const KV_TRAIT = 'gs-attributes';
        const KV_RESERVED = ['id', 'class', 'style', 'href', 'target', 'title', 'alt'];
        const isKvReserved = (k) =>
          KV_RESERVED.includes(k) || /^on/i.test(k) || k.indexOf('data-gjs-') === 0;

        function gsKvToString(attrs) {
          return Object.keys(attrs || {})
            .filter((k) => !isKvReserved(k))
            .sort()
            .map((k) => `${k}=${String(attrs[k]).replace(/[\r\n]+/g, ' ')}`)
            .join('\n');
        }

        function gsKvApply(cmp, text) {
          const wanted = {};
          String(text || '')
            .split('\n')
            .forEach((line) => {
              const part = line.trim();
              if (!part) return;
              const eq = part.indexOf('=');
              const k = (eq > -1 ? part.slice(0, eq) : part).trim();
              if (!k || isKvReserved(k)) return;
              let v = eq > -1 ? part.slice(eq + 1).trim() : '';
              if (/^(".*"|'.*')$/.test(v)) v = v.slice(1, -1);
              wanted[k] = v;
            });
          const cur = cmp.getAttributes();
          const toRemove = Object.keys(cur).filter((k) => !isKvReserved(k) && !(k in wanted));
          const toAdd = {};
          Object.keys(wanted).forEach((k) => {
            if (String(cur[k] ?? '') !== wanted[k]) toAdd[k] = wanted[k];
          });
          if (toRemove.length) cmp.removeAttributes(toRemove);
          if (Object.keys(toAdd).length) cmp.addAttributes(toAdd);
          return toRemove.length || Object.keys(toAdd).length > 0;
        }

        editor.Traits.addType('key-values', {
          init() {
            if (this.target && this.target.on) {
              this.listenTo(this.target, 'change:attributes', () => {
                const el = this.getInputElem();
                const v = gsKvToString(this.target.getAttributes());
                if (el && el.value !== v) el.value = v;
              });
            }
          },
          createInput() {
            const ta = document.createElement('textarea');
            ta.className = 'gs-kv-input';
            ta.rows = 3;
            ta.spellcheck = false;
            ta.placeholder = 'data-size="lg"\naria-label="Hero"';
            ta.value = gsKvToString(this.target.getAttributes());
            return ta;
          },
          onChange() {
            const el = this.getInputElem();
            if (el) gsKvApply(this.target, el.value);
            this.postUpdate();
          },
        });

        function ensureKvTrait(cmp) {
          if (!cmp || cmp.get('tagName') === 'body') return;
          if (cmp.getTrait(KV_TRAIT)) return;

        const editorEl = el('editor');

        function setRightOpen(open) {
          editorEl.classList.toggle('gs-right-open', open);
        }
        function setLeftOpen(open) {
          editorEl.classList.toggle('gs-left-open', open);
          leftPanel.classList.toggle('open', open);
        }
        function syncRightOpen() {
          setRightOpen(VIEW_CMDS.some((c) => editor.Commands.isActive(c)));
        }

        function toggleView(cmd) {
          VIEW_CMDS.forEach((c) => {
            if (c !== cmd) editor.stopCommand(c);
          });
          if (editor.Commands.isActive(cmd)) {
            editor.stopCommand(cmd);
          } else {
            editor.runCommand(cmd);

          syncRail();

          const list = leftPanel.querySelector('.gs-pages-list');
          editor.Pages.getAll().forEach((page) => {
            const selected = page === editor.Pages.getSelected();
            const row = document.createElement('div');
            row.className = 'gs-page-item' + (selected ? ' active' : '');
            row.innerHTML =
              '<span class="gs-page-name">' + esc(page.getName()) + '</span>' +

              '<button type="button" class="gs-page-act gs-page-settings" title="Page settings">' + icon('settings') + '</button>' +

              '<button type="button" class="gs-page-act gs-page-del" title="Delete">' + icon('trash') + '</button>' +

              editor.Pages.select(page.getId());
            });
            row.querySelector('.gs-page-settings').addEventListener('click', (e) => {
              e.stopPropagation();
              openPageSettings(page);
            });
            row.querySelector('.gs-page-rename').addEventListener('click', (e) => {
              e.stopPropagation();
              const name = prompt('Page name:', page.getName());
              if (name && name.trim()) {
                page.setName(name.trim());
                renderPages();
              }
            });
            row.querySelector('.gs-page-del').addEventListener('click', (e) => {
              e.stopPropagation();
              if (editor.Pages.getAll().length <= 1) {
                showToast('You need at least one page', 'error');
                return;
              }
              if (confirm('Delete page "' + page.getName() + '"?')) {
                editor.Pages.remove(page.getId());
              }
            });
            list.appendChild(row);
          });
          leftPanel.querySelector('.gs-pages-add').addEventListener('click', () => {
            const page = editor.Pages.add({
              name: 'New page',
              component: '<div style="padding:60px;text-align:center;color:#888;font-family:Inter,sans-serif">New page</div>',
            });
            editor.Pages.select(page.getId());
          });
        }

        function field(id, label, value, hint, textarea) {
          const v = esc(value == null ? '' : String(value));
          return (
            '<label class="gs-field" for="' + id + '">' +
            '<span class="gs-field-label">' + label + '</span>' +
            (textarea
              ? '<textarea id="' + id + '" rows="3" spellcheck="false">' + v + '</textarea>'
              : '<input id="' + id + '" type="text" value="' + v + '" spellcheck="false">') +
            (hint ? '<span class="gs-field-hint">' + hint + '</span>' : '') +
            '</label>'
          );
        }

        function openPageSettings(page) {
          const v = (k) => (k === 'name' ? page.getName() : page.get(k) || '');
          openModal({
            title: 'Page settings',
            bodyHTML:
              '<p class="gs-modal-hint">Per-page metadata. Applied to the exported page and the publish preview.</p>' +
              field('gs-ps-name', 'Name', v('name')) +
              field('gs-ps-title', 'Title', v('title'), 'Browser tab title; falls back to the page name.') +
              field('gs-ps-desc', 'Description', v('description'), 'Meta description shown in search results.') +
              field('gs-ps-fav', 'Favicon', v('favicon'), 'URL to the favicon (eg. /favicon.ico).') +
              field('gs-ps-kw', 'Keywords', v('keywords'), 'Comma-separated keywords for the meta keywords tag.') +
              field('gs-ps-ogtitle', 'Social title', v('socialTitle'), 'Title used when the page is shared on social media.') +
              field('gs-ps-ogimg', 'Social image', v('socialImage'), 'Image URL used when the page is shared.') +
              field('gs-ps-ogdesc', 'Social description', v('socialDescription'), 'Description used when the page is shared.') +
              field('gs-ps-head', 'Custom HTML head', v('customHead'), 'Injected before </head> in the exported page.', true) +
              field('gs-ps-body', 'Custom HTML body', v('customBody'), 'Injected before </body> in the exported page.', true),
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },
              {
                label: 'Save',
                variant: 'primary',
                onClick: () => {
                  const g = (id) => el(id).value;
                  const name = g('gs-ps-name').trim();
                  if (name && name !== page.getName()) page.setName(name);
                  page.set({
                    title: g('gs-ps-title').trim(),
                    description: g('gs-ps-desc').trim(),
                    favicon: g('gs-ps-fav').trim(),
                    keywords: g('gs-ps-kw').trim(),
                    socialTitle: g('gs-ps-ogtitle').trim(),
                    socialImage: g('gs-ps-ogimg').trim(),
                    socialDescription: g('gs-ps-ogdesc').trim(),
                    customHead: g('gs-ps-head'),
                    customBody: g('gs-ps-body'),
                  });
                  renderPages();
                  updateProjectName();
                  closeModal();
                  showToast('Page settings saved');
                },
              },
            ],
          });
        }

        function togglePages() {
          if (pagesOpen) {
            closePages();
          } else {
            openPages();
          }
        }
        function openPages() {
          if (symbolsOpen) closeSymbols();
          closeAllViews();
          pagesOpen = true;
          setLeftOpen(true);
          renderPages();
          syncRail();
        }
        function closePages() {
          pagesOpen = false;
          setLeftOpen(false);
          leftPanel.innerHTML = '';
          syncRail();
        }
        function closeAllViews(except) {
          VIEW_CMDS.forEach((c) => {
            if (c !== except) editor.stopCommand(c);
          });
          setRightOpen(VIEW_CMDS.some((c) => editor.Commands.isActive(c)));
        }

        /* --- Symbols (custom left panel) --- */
        let symbolsOpen = false;
        const Symbols = editor.Components;

        function symbolLabel(main) {
          return main.get('symbolName') || 'Unnamed symbol';
        }

        function renderSymbols() {
          if (!symbolsOpen) return;
          const mains = Symbols.getSymbols();
          leftPanel.innerHTML =
            '<div class="gs-pages-head"><span>Symbols</span></div>' +
            '<button type="button" class="gs-symbol-create" id="symbolCreate">' + icon('symbols') + '<span>Create symbol from selection</span></button>' +
            '<div class="gs-symbol-hint">Reusable components. Changes to a symbol update every place it is used.</div>' +
            '<div class="gs-pages-list"></div>';
          const list = leftPanel.querySelector('.gs-pages-list');
          if (!mains.length) {
            const empty = document.createElement('div');
            empty.className = 'gs-symbol-empty';
            empty.textContent = 'No symbols yet. Select a component on the canvas and create one.';
            list.appendChild(empty);
          }
          mains.forEach((main) => {
            const info = Symbols.getSymbolInfo(main);
            const count = info.instances.length;
            const row = document.createElement('div');
            row.className = 'gs-page-item gs-symbol-item';
            row.title = 'Drag to insert an instance';
            row.draggable = true;
            row.innerHTML =
              '<span class="gs-symbol-name">' + icon('symbols') + '<span>' + esc(symbolLabel(main)) + '</span></span>' +
              '<span class="gs-page-actions">' +
              '<span class="gs-symbol-count">' + count + '</span>' +
              '<button type="button" class="gs-page-act gs-symbol-del" title="Remove symbol">' + icon('trash') + '</button>' +
              '</span>';
            row.addEventListener('dragstart', (e) => {
              e.stopPropagation();
              e.dataTransfer.setData('text/plain', symbolLabel(main));
              e.dataTransfer.effectAllowed = 'copy';
              const temp = Symbols.addSymbol(main);
              const content = temp.toJSON();
              Symbols.detachSymbol(temp);
              editor.getModel().set('dragSource', {
                content: content,
              });
            });
            row.addEventListener('dragend', () => {
              editor.getModel().set({ dragResult: null, dragSource: undefined });
            });
            row.addEventListener('click', (e) => {
              if (e.target.closest('.gs-symbol-del')) return;
              insertSymbolInstance(main);
            });
            row.querySelector('.gs-symbol-del').addEventListener('click', (e) => {
              e.stopPropagation();
              if (confirm('Remove symbol "' + symbolLabel(main) + '"? Its instances will be detached.')) {
                main.remove();
                showToast('Symbol removed');
              }
            });
            list.appendChild(row);
          });
          const createBtn = leftPanel.querySelector('#symbolCreate');
          const sel = editor.getSelected();
          const valid = !!sel && !Symbols.getSymbolInfo(sel).isSymbol;
          createBtn.disabled = !valid;
          createBtn.addEventListener('click', createSymbol);
        }

        function createSymbol() {
          const sel = editor.getSelected();
          if (!sel || Symbols.getSymbolInfo(sel).isSymbol) return;
          const name = prompt('Symbol name:', sel.get('name') || 'Symbol');
          const main = Symbols.addSymbol(sel);
          if (!main) {
            showToast('Could not create the symbol', 'error');
            return;
          }
          if (name && name.trim()) main.set('symbolName', name.trim());
          showToast('Symbol created');
        }

        function insertSymbolInstance(main) {
          const wrapper = editor.getWrapper();
          const sel = editor.getSelected();
          const selIsSymbol = sel && Symbols.getSymbolInfo(sel).isSymbol;
          let target = sel && !selIsSymbol ? sel : wrapper;
          const instance = Symbols.addSymbol(main);
          if (!instance) return;
          if (target !== wrapper && !editor.Components.canMove(target, instance).result) target = wrapper;
          target.append(instance);
          editor.select(instance);
          showToast('Symbol instance inserted');
        }

        function toggleSymbols() {
          if (symbolsOpen) closeSymbols();
          else openSymbols();
        }
        function openSymbols() {
          if (pagesOpen) closePages();
          closeAllViews();
          symbolsOpen = true;
          setLeftOpen(true);
          renderSymbols();
          syncRail();
        }
        function closeSymbols() {
          symbolsOpen = false;
          setLeftOpen(false);
          leftPanel.innerHTML = '';
          syncRail();
        }

        /* --- Global variables (custom right panel) --- */
        const rightPanel = el('rightPanel');
        let variablesOpen = false;
        let syncingVars = false;

        function toHex(color) {
          if (!color) return '#000000';
          if (color.charAt(0) === '#') return /^#[0-9a-fA-F]{6}$/.test(color) || /^#[0-9a-fA-F]{3}$/.test(color) ? color : '#000000';
          const m = String(color).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
          if (m) {
            return '#' + [1, 2, 3].map((i) => ('0' + parseInt(m[i], 10).toString(16)).slice(-2)).join('');
          }
          return '#000000';
        }

        function fieldType(rec) {
          const f = rec.get('field');
          if (typeof f === 'string') return f;
          return (f && f.type) || 'text';
        }

        function fieldUnits(rec) {
          const f = rec.get('field');
          if (f && Array.isArray(f.units) && f.units.length) return f.units;
          return ['px', 'rem', 'em', '%'];
        }

        function selectOptions(rec) {
          const f = rec.get('field');
          const list = (f && f.options) || [];
          return list.map((o) => {
            if (typeof o === 'string') return { id: o, label: o };
            return { id: o.id, label: o.label != null ? o.label : o.id };
          });
        }

        function varInputHTML(rec) {
          const prop = rec.get('property') || 'value';
          const value = rec.get('value');
          const t = fieldType(rec);
          const escv = (s) => esc(s == null ? '' : String(s));
          if (t === 'color') {
            return '<span class="gs-var-color">' +
              '<input type="text" class="gs-var-text" value="' + escv(value) + '" data-var-input spellcheck="false">' +
              '<input type="color" class="gs-var-picker" value="' + toHex(value) + '">' +
              '</span>';
          }
          if (t === 'number') {
            return '<input type="number" class="gs-var-num" value="' + escv(value).replace(/[^0-9.\-]/g, '') + '" data-var-input step="any">';
          }
          if (t === 'slider') {
            return '<input type="range" class="gs-var-range" data-var-input>';
          }
          if (t === 'select') {
            const opts = selectOptions(rec);
            return '<select class="gs-var-select" data-var-input>' +
              opts.map((o) => '<option value="' + escv(o.id) + '"' + (String(o.id) === String(value) ? ' selected' : '') + '>' + escv(o.label) + '</option>').join('') +
              '</select>';
          }
          return '<input type="text" class="gs-var-text" value="' + escv(value) + '" data-var-input spellcheck="false">';
        }

        function renderVariables() {
          if (!variablesOpen) return;
          syncVarRules();
          const dss = editor.DataSources.getAll();
          const groups = {};
          dss.forEach((ds) => {
            ds.getRecords().forEach((rec) => {
              if (!rec.get('property')) return;
              const cat = rec.get('category');
              const catLabel =
                cat && typeof cat === 'object' ? cat.label || 'General' : typeof cat === 'string' ? cat : 'General';
              (groups[catLabel] = groups[catLabel] || []).push({ ds: ds, rec: rec });
            });
          });
          const head =
            '<div class="gs-pages-head"><span>Global</span></div>' +
            '<div class="gs-var-hint">Theme values and CSS variables applied across the whole project. Changes update every page instantly.</div>' +
            '<button type="button" class="gs-pages-add" id="varAdd">' + icon('plus') + '<span>Add variable</span></button>';
          const keys = Object.keys(groups);
          let list = '<div class="gs-var-list">';
          keys.forEach((k) => {
            list += '<div class="gs-var-group"><div class="gs-var-group-title">' + esc(k) + '</div>';
            groups[k].forEach(({ ds, rec }) => {
              const prop = rec.get('property');
              const sel = rec.get('selector') || '';
              const label = rec.get('label') || rec.id || prop;
              list +=
                '<div class="gs-var-row" data-dsid="' + esc(ds.id) + '" data-rec="' + esc(rec.id) + '">' +
                '<div class="gs-var-row-head">' +
                '<span class="gs-var-label" title="' + esc(label) + '">' + esc(label) + '</span>' +
                '<button type="button" class="gs-page-act gs-var-del" title="Remove variable">' + icon('trash') + '</button>' +
                '</div>' +
                varInputHTML(rec) +
                '<span class="gs-var-meta">' + esc(sel) + ' ' + esc(prop) + '</span>' +
                '</div>';
            });
            list += '</div>';
          });
          list += '</div>';
          rightPanel.innerHTML = head + (keys.length ? list : '<div class="gs-symbol-empty">No global variables yet. Add one to define a reusable theme value.</div>');
          const addBtn = rightPanel.querySelector('#varAdd');
          if (addBtn) addBtn.addEventListener('click', addVariableDialog);
        }

        function findVarRule(sel, prop) {
          const propKey = prop == null ? '' : String(prop);
          const rules = editor.Css.getAll();
          let r = rules.find((x) => !x.get('atRuleType') && x.getStyle() && propKey && x.getStyle()[propKey] !== undefined);
          if (r) return r;
          const s = String(sel || ':root').trim();
          return rules.find((x) => {
            if (x.get('atRuleType')) return false;
            if (!s) return false;
            try {
              return x.selectorsToString().split(',').map((t) => t.trim()).includes(s);
            } catch (e) {
              return false;
            }
          }) || null;
        }

        function syncVarRules() {
          if (syncingVars) return;
          syncingVars = true;
          try {
            editor.DataSources.getAll().forEach((ds) => {
              ds.getRecords().forEach((rec) => {
                const prop = rec.get('property');
                if (!prop) return;
                const sel = rec.get('selector') || ':root';
                if (findVarRule(sel, prop)) return;
                editor.Css.addRules(sel + '{' + prop + ':' + String(rec.get('value')) + '}');
              });
            });
          } catch (e) {
            console.warn('syncVarRules', e);
          } finally {
            syncingVars = false;
          }
        }

        function applyVarValue(dsId, recId, value) {
          const ds = editor.DataSources.get(dsId);
          const rec = ds && ds.getRecord(recId);
          if (!rec) return;
          const prop = rec.get('property');
          const sel = rec.get('selector') || ':root';
          rec.set('value', value);
          if (!prop) return;
          let rule = findVarRule(sel, prop);
          if (!rule) rule = editor.Css.addRules(sel + '{' + prop + ':' + String(value) + '}')[0];
          rule.addStyle({ [prop]: value });
        }

        function deleteVar(dsId, recId) {
          const ds = editor.DataSources.get(dsId);
          const rec = ds && ds.getRecord(recId);
          if (!rec) return;
          const prop = rec.get('property');
          const sel = rec.get('selector') || ':root';
          const label = rec.get('label') || rec.id || prop;
          if (!confirm('Remove variable "' + label + '"?')) return;
          try {
            ds.removeRecord(recId);
          } catch (e) {}
          const rule = findVarRule(sel, prop);
          if (rule) {
            rule.removeStyle(prop);
            const style = rule.getStyle() || {};
            if (!Object.keys(style).length) editor.Css.remove(rule);
          }
          renderVariables();
          showToast('Variable removed');
        }

        function addVariableDialog() {
          openModal({
            title: 'New global variable',
            bodyHTML:
              '<p class="gs-modal-hint">Define a CSS variable (or any other global declaration) that applies site-wide. Use the value everywhere via <b>var(--name)</b>.</p>' +
              '<label class="gs-field" for="gs-var-name"><span class="gs-field-label">Name</span><input id="gs-var-name" type="text" spellcheck="false"></label>' +
              '<label class="gs-field" for="gs-var-prop"><span class="gs-field-label">CSS property</span><input id="gs-var-prop" type="text" placeholder="--brand-color" spellcheck="false"><span class="gs-field-hint">Custom properties start with <b>--</b>.</span></label>' +
              '<label class="gs-field" for="gs-var-sel"><span class="gs-field-label">Selector</span><input id="gs-var-sel" type="text" value=":root" spellcheck="false"><span class="gs-field-hint">Element that receives the declaration (default <b>:root</b> so components can reference it).</span></label>' +
              '<label class="gs-field" for="gs-var-type"><span class="gs-field-label">Type</span>' +
              '<select id="gs-var-type"><option value="color">Color</option><option value="text">Text</option><option value="number">Number</option></select></label>' +
              '<label class="gs-field" for="gs-var-value"><span class="gs-field-label">Value</span><input id="gs-var-value" type="text" value="#000000" spellcheck="false"></label>',
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },
              { label: 'Add', variant: 'primary', onClick: onAddVariable },
            ],
          });
        }

        function onAddVariable() {
          const name = el('gs-var-name').value.trim();
          const prop = el('gs-var-prop').value.trim();
          const sel = (el('gs-var-sel').value.trim() || ':root').trim();
          const type = el('gs-var-type').value;
          const value = el('gs-var-value').value.trim() || '#000000';
          if (!prop) {
            showToast('CSS property is required', 'error');
            return;
          }
          let ds = editor.DataSources.get('globalStyles');
          if (!ds) ds = editor.DataSources.add({ id: 'globalStyles', records: [] });
          const recId = 'v' + Date.now().toString(36);
          ds.addRecord({
            id: recId,
            label: name || prop,
            property: prop,
            selector: sel,
            value: value,
            field: { row: true, type: type },
            defaultValue: value,
            _internal: true,
            _undo: true,
          });
          let rule = findVarRule(sel, prop);
          if (!rule) rule = editor.Css.addRules(sel + '{' + prop + ':' + String(value) + '}')[0];
          rule.addStyle({ [prop]: value });
          closeModal();
          renderVariables();
          showToast('Variable added');
        }

        function toggleVariables() {
          if (variablesOpen) closeVariables();
          else openVariables();
        }
        function openVariables() {
          closeAllViews();
          variablesOpen = true;
          rightPanel.classList.add('open');
          setRightOpen(true);
          renderVariables();
          syncRail();
        }
        function closeVariables() {
          variablesOpen = false;
          rightPanel.classList.remove('open');
          setRightOpen(false);
          rightPanel.innerHTML = '';
          syncRail();
        }

        rightPanel.addEventListener('input', (e) => {
          const input = e.target.closest('[data-var-input], .gs-var-picker');
          if (!input) return;
          const row = input.closest('.gs-var-row');
          if (!row) return;
          const dsId = row.dataset.dsid;
          const recId = row.dataset.rec;
          const ds = editor.DataSources.get(dsId);
          const rec = ds && ds.getRecord(recId);
          if (!rec) return;
          const t = fieldType(rec);
          let value;
          if (t === 'color') {
            const isPicker = input.classList && input.classList.contains('gs-var-picker');
            value = input.value;
            if (isPicker) {
              const text = row.querySelector('.gs-var-text');
              if (text) text.value = input.value;
            } else {
              const picker = row.querySelector('.gs-var-picker');
              if (picker && /^#[0-9a-fA-F]{3,6}$/.test(value.trim())) picker.value = value.trim();
            }
          } else {
            value = input.value;
            if (t === 'number' && value !== '') {
              const cur = String(rec.get('value'));
              const unit = cur.match(/[a-z%]+$/i) ? cur.match(/[a-z%]+$/i)[0] : '';
              value = value + unit;
            }
          }
          applyVarValue(dsId, recId, value);
        });

        rightPanel.addEventListener('click', (e) => {
          const del = e.target.closest('.gs-var-del');
          if (!del) return;
          const row = del.closest('.gs-var-row');
          if (!row) return;
          deleteVar(row.dataset.dsid, row.dataset.rec);
        });

        editor.on('data:add data:update data:remove', () => {
          if (variablesOpen) renderVariables();
        });

        /* --- Assets (core modal) --- */
        function toggleAssets() {
          editor.runCommand('core:open-assets');
        }

        /* --- Rail --- */
        const rail = el('rail');
        const railMap = {
          pages: togglePages,
          symbols: toggleSymbols,
          layers: () => toggleView(CMD.layers),
          blocks: () => toggleView(CMD.blocks),
          styles: () => toggleView(CMD.styles),
          traits: () => toggleView(CMD.traits),
          global: toggleVariables,
          assets: toggleAssets,
        };

        function syncRail() {
          const rightActive = VIEW_CMDS.filter((c) => editor.Commands.isActive(c))[0];
          setRightOpen(!!rightActive || variablesOpen);
          document.querySelectorAll('.gs-rail-btn[data-side]').forEach((btn) => {
            const side = btn.dataset.side;
            let active = false;
            if (side === 'pages') active = pagesOpen;
            else if (side === 'symbols') active = symbolsOpen;
            else if (side === 'global') active = variablesOpen;
            else if (side === 'assets') active = false;
            else active = rightActive === CMD[side];
            btn.classList.toggle('active', active);
          });
        }

        rail.addEventListener('click', (e) => {
          const btn = e.target.closest('.gs-rail-btn');
          if (!btn) return;
          const side = btn.dataset.side;
          if (side) railMap[side]();
        });
        el('railRight').addEventListener('click', (e) => {
          const btn = e.target.closest('.gs-rail-btn');
          if (!btn) return;
          const side = btn.dataset.side;
          if (side) railMap[side]();
        });

        editor.on('command:run command:stop', syncRail);
        editor.on('page:select page:add page:remove page:update', () => {
          renderPages();
          updateProjectName();
        });
        editor.on('symbol:main:add symbol:main:remove symbol:main:update symbol:instance:add symbol:instance:remove', () => {
          if (symbolsOpen) renderSymbols();
        });
        editor.on('component:selected', () => {
          if (symbolsOpen) renderSymbols();
        });

        /* ------------------------------------------------------------------ */
        /*  Top bar                                                            */
        /* ------------------------------------------------------------------ */
        function updateProjectName() {
          const page = editor.Pages.getSelected();
          el('projectName').innerHTML =
            '<span>' + esc(page ? page.getName() : 'Untitled') + '</span>' +
            '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"/></svg>';
        }
        el('projectName').addEventListener('click', () => togglePages());

        function setDevice(id) {
          editor.Devices.select(id);
        }
        el('devices').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-device]');
          if (!btn) return;
          el('devices').querySelectorAll('button').forEach((b) => b.classList.toggle('active', b === btn));
          setDevice(btn.dataset.device);
        });

        let _previewHtml = null;
        let _previewUrl = null;
        let _previewPageId = null;

        function previewPagesMap() {
          const map = new Map();
          editor.Pages.getAll().forEach((page, i) => {
            const name = String(page.getName() || '');
            const base = i === 0 ? 'index' : slug(name) || 'page-' + (i + 1);
            const keys = new Set([base, base + '.html', page.getId()]);
            if (i === 0) {
              keys.add('index');
              keys.add('index.html');
            }
            if (name) {
              keys.add(name.toLowerCase());
              keys.add(name.toLowerCase() + '.html');
            }
            if (i > 0) {
              keys.add(slug(name));
              keys.add(slug(name) + '.html');
            }
            keys.forEach((k) => map.set(k.toLowerCase().replace(/^\//, ''), page));
          });
          return map;
        }

        function currentPreviewPage() {
          const pages = editor.Pages.getAll();
          return _previewPageId ? pages.find((p) => p.getId() === _previewPageId) : editor.Pages.getSelected();
        }

        function renderPreviewDoc() {
          const page = currentPreviewPage() || editor.Pages.getSelected();
          const name = page ? page.getName() : 'Untitled';
          const dev = editor.getDevice ? editor.getDevice() : '';
          _previewHtml = buildPageDoc(page);
          el('previewName').textContent = 'Preview — ' + name;
          el('previewDev').textContent = dev ? 'Viewing at ' + dev + ' width' : 'Viewing at browser width';
          const host = el('previewHost');
          const old = el('previewFrame');
          const frame = document.createElement('iframe');
          frame.id = 'previewFrame';
          frame.allow = 'fullscreen; autoplay; clipboard-write';
          frame.title = 'Site preview';
          if (old) old.remove();
          host.appendChild(frame);
          frame.srcdoc = _previewHtml;
        }

        function previewFrameClickHandler(e) {
          const a = e.target.closest ? e.target.closest('a[href]') : null;
          if (!a) return;
          const target = a.target || '';
          if (target === '_blank') return;
          const href = a.getAttribute('href') || '';
          if (!href || href.charAt(0) === '#' || /^(https?:|mailto:|tel:|javascript:|data:)/i.test(href)) return;
          let clean = href.split(/[?#]/)[0].replace(/^\.\//, '').replace(/^\/+/, '').replace(/\/+$/, '');
          try {
            clean = decodeURIComponent(clean);
          } catch (err) {
            /* keep as-is */
          }
          clean = clean.toLowerCase();
          if (!clean) return;
          const page = previewPagesMap().get(clean);
          if (!page) return;
          e.preventDefault();
          e.stopPropagation();
          if (page.getId() === _previewPageId) return;
          _previewPageId = page.getId();
          renderPreviewDoc();
        }

        function openSitePreview() {
          const preview = el('preview');
          _previewPageId = null;
          preview.hidden = false;
          requestAnimationFrame(() => preview.classList.add('open'));
          renderPreviewDoc();
        }

        function closeSitePreview() {
          const preview = el('preview');
          if (preview.hidden) return;
          preview.classList.remove('open');
          setTimeout(() => {
            preview.hidden = true;
            const frame = el('previewFrame');
            if (frame) frame.removeAttribute('srcdoc');
          }, 160);
        }

        function previewInNewTab() {
          const page = currentPreviewPage() || editor.Pages.getSelected();
          _previewHtml = buildPageDoc(page);
          if (_previewUrl) URL.revokeObjectURL(_previewUrl);
          const blob = new Blob([_previewHtml], { type: 'text/html' });
          _previewUrl = URL.createObjectURL(blob);
          const win = window.open(_previewUrl, '_blank');
          if (!win) showToast('Allow pop-ups to open the preview in a new tab', 'error');
        }

        el('previewHost').addEventListener('load', (ev) => {
          const frame = ev.target;
          if (!frame || frame.tagName !== 'IFRAME') return;
          const doc = frame.contentDocument;
          if (doc) doc.addEventListener('click', previewFrameClickHandler, true);
        }, true);

        /* --- Import / export (.zip) --- */
        function slug(name) {
          return String(name || 'project').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'project';
        }

        let _lastExportUrl = null;

        function triggerDownload(name, blob) {
          if (_lastExportUrl) URL.revokeObjectURL(_lastExportUrl);
          const url = URL.createObjectURL(blob);
          _lastExportUrl = url;
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }

        async function downloadZip() {
          const pages = editor.Pages.getAll();
          const name = pages.length ? pages[0].getName() : 'Untitled';
          const filename = slug(name) + '.zip';
          try {
            const zip = new JSZip();
            const used = new Set();
            pages.forEach((page, i) => {
              let base = i === 0 ? 'index' : slug(page.getName());
              if (i > 0 && !base) base = 'page-' + (i + 1);
              let fname = base + '.html';
              let n = 2;
              while (used.has(fname)) {
                fname = base + '-' + (n++) + '.html';
              }
              used.add(fname);
              zip.file(fname, buildPageDoc(page));
            });
            const blob = await zip.generateAsync(
              { type: 'blob' },
              (meta) => {
                showProgress('Packaging ' + slug(name) + '.zip…', Math.round(meta.percent || 0));
              }
            );
            hideProgress();
            triggerDownload(filename, blob);
            closeModal();
            showToast('Exported ' + pages.length + ' page' + (pages.length === 1 ? '' : 's') + ' as ' + filename);
          } catch (err) {
            console.error(err);
            showToast('Could not export the project', 'error');
          }
        }

        function downloadProject() {
          try {
            const data = editor.getProjectData();
            const sel = editor.Pages.getSelected();
            const name = slug(sel ? sel.getName() : 'project');
            triggerDownload(name + '.json', new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
            closeModal();
            showToast('Project exported as ' + name + '.json');
          } catch (err) {
            console.error(err);
            showToast('Could not export the project', 'error');
          }
        }

        async function homeImportFile(file) {
          if (!file) {
            showToast('Choose a file first', 'error');
            return;
          }
          const lower = (file.name || '').toLowerCase();
          const base =
            (file.name || 'Imported project').replace(/\.[a-z0-9]+$/i, '').trim() || 'Imported project';
          let data = null;
          let html = null;
          try {
            showProgress('Importing «' + base + '»…', 10);
            if (lower.endsWith('.zip')) {
              const zip = await JSZip.loadAsync(
                file,
                (meta) => showProgress('Unpacking ' + file.name + '…', 10 + Math.round((meta.percent || 0) * 0.4))
              );
              const allFiles = Object.keys(zip.files).filter((n) => !zip.files[n].dir);
              const projectFile = allFiles.find((n) => n.toLowerCase().endsWith('.grapesjs') || n.toLowerCase().endsWith('.gjs') || n.toLowerCase().endsWith('.json'));
              if (projectFile) {
                data = JSON.parse(await zip.files[projectFile].async('string'));
              } else {
                const names = allFiles.filter((n) => n.toLowerCase().endsWith('.html'));
                if (!names.length) {
                  hideProgress();
                  showToast('No importable file found in the archive', 'error');
                  return;
                }
                const preferred = names.find((n) => n.toLowerCase().endsWith('index.html')) || names[0];
                html = await zip.files[preferred].async('string');
              }
            } else if (lower.endsWith('.grapesjs') || lower.endsWith('.gjs') || lower.endsWith('.json')) {
              data = JSON.parse(await file.text());
            } else {
              hideProgress();
              showToast('Choose a .grapesjs (project), .json (project) or .zip (website) file', 'error');
              return;
            }
          } catch (err) {
            hideProgress();
            console.error(err);
            showToast('Could not read that file', 'error');
            return;
          }
          const id = makeId();
          let projData;
          if (data) {
            projData = data;
          } else {
            if (!defaultProjectData) defaultProjectData = editor.getProjectData();
            projData = JSON.parse(JSON.stringify(defaultProjectData));
          }
          setProgress(65);
          writeProj(id, projData);
          const list = readRegistry();
          list.unshift({ id, name: base, createdAt: Date.now(), updatedAt: Date.now() });
          writeRegistry(list);
          openProject(id);
          if (html) {
            editor.setComponents(html);
            persistCurrent();
          }
          setProgress(100);
          hideProgress();
          closeModal();
          showToast('Project «' + base + '» imported from ' + file.name);
        }

        /* --- Publish (standalone preview) --- */
        function buildPageDoc(page) {
          const p = page || editor.Pages.getSelected();
          const name = p ? p.getName() : 'Untitled';
          const main = p ? p.getMainComponent() : null;
          const html = main ? editor.getHtml({ component: main }) : '';
          const css = editor.getCss({ component: main }) || '';
          const js = editor.getJs({ component: main }) || '';
          const g = (k) => (p ? String(p.get(k) || '') : '');
          const meta =
            (g('description') ? '<meta name="description" content="' + esc(g('description')) + '"/>' : '') +
            (g('keywords') ? '<meta name="keywords" content="' + esc(g('keywords')) + '"/>' : '') +
            (g('favicon') ? '<link rel="icon" href="' + esc(g('favicon')) + '"/>' : '') +
            (g('socialTitle') ? '<meta property="og:title" content="' + esc(g('socialTitle')) + '"/>' : '') +
            (g('socialDescription') ? '<meta property="og:description" content="' + esc(g('socialDescription')) + '"/>' : '') +
            (g('socialImage') ? '<meta property="og:image" content="' + esc(g('socialImage')) + '"/>' : '') +
            (g('customHead') ? '\n' + g('customHead') : '');
          return (
            '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>' +
            '<meta name="viewport" content="width=device-width, initial-scale=1"/>' +
            '<title>' + esc(g('title') || name) + '</title>' + meta +
            '<style>' + BASE_CSS + '\n' + css + '</style></head>' +
            '<body>' + html +
            (g('customBody') ? '\n' + g('customBody') : '') +
            '<script>' + js + '</' + 'script>' +
            '</body></html>'
          );
        }

        /* ------------------------------------------------------------------ */
        /*  Neocities publish                                                  */
        /* ------------------------------------------------------------------ */
        const NC_USER_KEY = 'grapeNeocitiesUser';
        const NC_KEY_KEY = 'grapeNeocitiesKey';
        const NC_LAST_KEY = 'grapeNeocitiesLastPublish';
        const NC_MIN_INTERVAL = 60000;

        function ncSaveCreds(user, key) {
          localStorage.setItem(NC_USER_KEY, user);
          localStorage.setItem(NC_KEY_KEY, key);
        }
        function ncClearCreds() {
          localStorage.removeItem(NC_USER_KEY);
          localStorage.removeItem(NC_KEY_KEY);
        }
        function ncCooldownLeft() {
          const last = +(localStorage.getItem(NC_LAST_KEY) || 0);
          return last + NC_MIN_INTERVAL - Date.now();
        }

        function ncSiteFiles() {
          const pages = editor.Pages.getAll();
          const files = [];
          const used = new Set();
          pages.forEach((page, i) => {
            let base = i === 0 ? 'index' : slug(page.getName());
            if (i > 0 && !base) base = 'page-' + (i + 1);
            let fname = base + '.html';
            let n = 2;
            while (used.has(fname)) fname = base + '-' + (n++) + '.html';
            used.add(fname);
            files.push({ name: fname, content: buildPageDoc(page) });
          });
          return files;
        }

        async function ncUpload(user, key, files) {
          const form = new FormData();
          files.forEach((f) => form.append('file[]', new Blob([f.content], { type: 'text/html' }), f.name));
          const res = await fetch('https://neocities.org/api/upload', {
            method: 'POST',
            headers: { Authorization: 'Basic ' + btoa(user + ':' + key) },
            body: form,
          });
          return res.json();
        }

        function ncSaveFromForm() {
          const user = document.getElementById('ncUser').value.trim();
          const key = document.getElementById('ncKey').value.trim();
          if (user && key) {
            ncSaveCreds(user, key);
            showToast('Neocities credentials saved');
            return true;
          }
          showToast('Enter your Neocities username and API key', 'error');
          return false;
        }

        async function ncPublishFromDialog() {
          const user = document.getElementById('ncUser').value.trim();
          const key = document.getElementById('ncKey').value.trim();
          if (!user || !key) {
            showToast('Enter your Neocities username and API key', 'error');
            return;
          }
          const left = ncCooldownLeft();
          if (left > 0) {
            showToast('Please wait ' + Math.ceil(left / 1000) + 's before publishing again (Neocities: 1 update/minute)', 'error');
            return;
          }
          const files = ncSiteFiles();
          if (!files.length) {
            showToast('No pages to publish', 'error');
            return;
          }
          const btn = document.querySelector('.gs-btn--primary');
          btn.disabled = true;
          btn.textContent = 'Publishing…';
          try {
            showProgress('Publishing to Neocities…');
            const json = await ncUpload(user, key, files);
            hideProgress();
            if (json && json.result === 'success') {
              localStorage.setItem(NC_LAST_KEY, String(Date.now()));
              ncSaveCreds(user, key);
              closeModal();
              showToast(
                'Published ' + files.length + ' file' + (files.length === 1 ? '' : 's') +
                ' to https://' + user + '.neocities.org/'
              );
            } else {
              const msg = (json && json.message) ? json.message : 'Neocities rejected the upload';
              showToast('Publish failed: ' + msg, 'error');
              btn.disabled = false;
              btn.textContent = 'Publish';
            }
          } catch (err) {
            hideProgress();
            console.error(err);
            showToast('Could not connect to Neocities: ' + (err.message || 'network error'), 'error');
            btn.disabled = false;
            btn.textContent = 'Publish';
          }
        }

        function neocitiesDialog() {
          const user = localStorage.getItem(NC_USER_KEY) || '';
          const hasCreds = !!(user && localStorage.getItem(NC_KEY_KEY));
          const left = ncCooldownLeft();

              '<label class="gs-field-label">API key</label>' +
              '<input id="ncKey" class="gs-field-input" type="password" placeholder="••••••••••••••••" autocomplete="current-password"' +
              (hasCreds ? ' value="' + esc(localStorage.getItem(NC_KEY_KEY)) + '"' : '') + ' />' +
              '<p class="gs-modal-hint gs-nc-note">' +
              (left > 0
                ? 'Rate limit: you can publish again in ' + Math.ceil(left / 1000) + 's.'
                : 'Neocities limits recurring updates to one per minute.') +
              '</p>',
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },

        /* ------------------------------------------------------------------ */
        /*  Multi-project home                                                 */
        /* ------------------------------------------------------------------ */
        const REG_KEY = 'grapeProjects';
        const LEGACY_KEY = 'gjsProject';
        let currentProjectId = null;
        let defaultProjectData = null;
        let saveTimer = null;

        const projKey = (id) => 'grapeProject:' + id;
        const readRegistry = () => {
          try {
            return JSON.parse(localStorage.getItem(REG_KEY) || '[]');
          } catch (err) {
            return [];
          }
        };
        const writeRegistry = (list) => localStorage.setItem(REG_KEY, JSON.stringify(list));
        const makeId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const readProj = (id) => {
          try {
            return JSON.parse(localStorage.getItem(projKey(id)));
          } catch (err) {
            return null;
          }
        };
        const writeProj = (id, data) => localStorage.setItem(projKey(id), JSON.stringify(data));
        const removeProj = (id) => localStorage.removeItem(projKey(id));

        function migrateLegacy() {
          if (readRegistry().length) return;
          const legacy = localStorage.getItem(LEGACY_KEY);
          if (!legacy) return;
          try {
            const data = JSON.parse(legacy);
            if (!data || !data.pages) return;
            const id = makeId();
            writeProj(id, data);
            writeRegistry([{ id, name: 'My Website', createdAt: Date.now(), updatedAt: Date.now() }]);
          } catch (err) {
            console.error('Migration failed', err);
          }
        }

        function persistCurrent() {
          if (!currentProjectId) return false;
          try {
            showProgress('Saving…');
            writeProj(currentProjectId, editor.getProjectData());
            const list = readRegistry();
            const rec = list.find((r) => r.id === currentProjectId);
            if (rec) {
              rec.updatedAt = Date.now();
              writeRegistry(list);
            }
            hideProgress();
            return true;
          } catch (err) {
            hideProgress();
            console.error('Could not save project', err);
            return false;
          }
        }

          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => {
            if (editor.getEditing()) {

            persistCurrent();

        function timeAgo(ts) {
          const s = Math.floor((Date.now() - ts) / 1000);
          if (s < 60) return 'just now';
          const m = Math.floor(s / 60);
          if (m < 60) return m + 'm ago';
          const h = Math.floor(m / 60);
          if (h < 24) return h + 'h ago';
          const d = Math.floor(h / 24);
          if (d < 7) return d + 'd ago';
          return new Date(ts).toLocaleDateString();
        }

        function renderHome() {
          const q = el('searchInput').value.trim().toLowerCase();
          const sort = el('sortBy').value;
          let list = readRegistry().filter((r) => !q || (r.name || '').toLowerCase().includes(q));
          if (sort === 'name') list.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          else if (sort === 'created') list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          else list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
          el('projCount').textContent = list.length + (list.length === 1 ? ' project' : ' projects');
          el('projGrid').innerHTML = list.map(cardHTML).join('');
          el('homeEmpty').toggleAttribute('hidden', list.length > 0);
        }

        function showHome() {
          renderHome();
          el('home').classList.toggle('gs-hidden', false);
        }

        function showApp() {
          el('home').classList.add('gs-hidden');
        }

        function goHome() {
          persistCurrent();
          showHome();
        }

        function openProject(id) {
          const data = readProj(id);
          if (!data) {
            showToast('Could not load that project', 'error');
            return;
          }
          currentProjectId = id;
          try {
            editor.loadProjectData(data);
          } catch (err) {
            console.error('loadProjectData failed', err);
          }
          renderPages();
          updateProjectName();
          syncRail();
          if (symbolsOpen) renderSymbols();
          if (variablesOpen) renderVariables();
          setTimeout(syncVarRules, 0);
          showApp();
        }

        function createProject(name) {
          const clean = (name || '').trim() || 'My Website';
          const id = makeId();
          if (!defaultProjectData) defaultProjectData = editor.getProjectData();
          writeProj(id, JSON.parse(JSON.stringify(defaultProjectData)));
          const list = readRegistry();
          list.unshift({ id, name: clean, createdAt: Date.now(), updatedAt: Date.now() });
          writeRegistry(list);
          openProject(id);
          showToast('Project «' + clean + '» created');
        }

        function createDialog() {
          openModal({
            title: 'Create new project',
            bodyHTML:
              '<label class="gs-field-label">Project name</label>' +
              '<input id="newProjName" class="gs-field-input" type="text" placeholder="My Website" value="My Website" />',
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },
              {
                label: 'Create',
                variant: 'primary',
                onClick: () => {
                  createProject(document.getElementById('newProjName').value);
                  closeModal();
                },
              },
            ],
          });
          setTimeout(() => {
            const inp = document.getElementById('newProjName');
            if (inp) {
              inp.focus();
              inp.select();
            }
          }, 0);
        }

        const renameDialog = (id) => {
          const rec = readRegistry().find((r) => r.id === id);
          if (!rec) return;
          openModal({
            title: 'Rename project',
            bodyHTML:
              '<label class="gs-field-label">Project name</label>' +
              '<input id="newProjName" class="gs-field-input" type="text" placeholder="My Website" />',
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },
              {
                label: 'Rename',
                variant: 'primary',
                onClick: () => {
                  const v = document.getElementById('newProjName').value.trim();
                  if (!v) return;
                  const list = readRegistry();
                  const r = list.find((x) => x.id === id);
                  if (r) {
                    r.name = v;
                    writeRegistry(list);
                    renderHome();
                  }
                  closeModal();
                },
              },
            ],
          });
          setTimeout(() => {
            const inp = document.getElementById('newProjName');
            if (inp) {
              inp.value = rec.name;
              inp.focus();
              inp.select();
            }
          }, 0);
        };

        const deleteDialog = (id) => {
          const rec = readRegistry().find((r) => r.id === id);
          if (!rec) return;
          openModal({
            title: 'Delete project?',
            bodyHTML:
              '<p class="gs-modal-hint">«' +
              esc(rec.name) +
              '» and all of its pages and data will be permanently removed from this browser.</p>',
            actions: [
              { label: 'Cancel', variant: 'ghost', onClick: closeModal },
              {
                label: 'Delete',
                variant: 'primary',
                onClick: () => {
                  removeProj(id);
                  writeRegistry(readRegistry().filter((r) => r.id !== id));
                  if (currentProjectId === id) {
                    currentProjectId = null;
                    showHome();
                  } else {
                    renderHome();
                  }
                  closeModal();
                },
              },
            ],
          });
        };

        el('projGrid').addEventListener('click', (e) => {
          const card = e.target.closest('.gs-home-card');
          if (!card) return;
          const id = card.dataset.id;
          const actEl = e.target.closest('[data-act]');
          if (actEl) {
            if (actEl.dataset.act === 'delete') deleteDialog(id);
            else if (actEl.dataset.act === 'rename') renameDialog(id);
          } else {
            openProject(id);
          }
        });

        el('btnHome').addEventListener('click', goHome);
        el('brandRoot').addEventListener('click', goHome);
        el('btnCreateProject').addEventListener('click', createDialog);
        el('btnCreateEmpty').addEventListener('click', createDialog);
        el('searchInput').addEventListener('input', renderHome);
        el('sortBy').addEventListener('change', renderHome);
        el('statusFilter').addEventListener('change', renderHome);

        /* ------------------------------------------------------------------ */
        /*  Init                                                               */
        /* ------------------------------------------------------------------ */
        function initIcons() {
          const map = {
            btnHome: 'home',
            btnUndo: 'undo',
            btnRedo: 'redo',
            btnPreview: 'preview',
            btnFullscreen: 'fullscreen',
            btnExport: 'export',
            btnSave: 'save',
            btnHelp: 'help',
          };
          Object.entries(map).forEach(([id, name]) => {
            el(id).insertAdjacentHTML('afterbegin', icon24(name));
          });
          document.querySelectorAll('.gs-rail-btn[data-side]').forEach((btn) => {
            btn.insertAdjacentHTML('afterbegin', icon24(btn.dataset.side));
          });
        }
        initIcons();

        el('btnSave').innerHTML = icon24('save') + '<span>Save</span>';
        el('btnPublishSite').innerHTML = icon24('rocket') + '<span>Publish</span>';

        updateProjectName();
        syncRail();

        editor.on('load', () => {
          if (!defaultProjectData) defaultProjectData = editor.getProjectData();
          openPages();
          editor.runCommand('core:open-blocks');
          updateProjectName();
          syncRail();
          setTimeout(syncVarRules, 0);
        });

        migrateLegacy();
        showHome();

        window.editor = editor;
      })();
    </script>
  </body>
</html>
